# Render deployment blueprint: hosts the Express API.
# The React client is deployed separately on Vercel and calls this service
# cross-origin (CLIENT_ORIGIN below must match the Vercel production domain).
#
# Free plan notes:
#   * The instance sleeps after ~15 minutes with no traffic; the first request
#     after idle takes 30-60 seconds to wake it (looks slow, not broken).
#   * SESSION_SECRET is generated by Render once and kept stable across
#     deploys, so live sessions survive redeploys.
#   * FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY are left unsynced on
#     purpose - paste them in the Render dashboard from your local .env.
services:
  - type: web
    name: northbridge-api
    runtime: node
    rootDirectory: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://north-bridge-hazel.vercel.app
      - key: COOKIE_SECURE
        value: "1"
      - key: COOKIE_SAMESITE
        value: none
      - key: SESSION_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: north-bridgebank
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
